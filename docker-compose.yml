version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: legalflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: legalflow_db
      MYSQL_USER: legalflow
      MYSQL_PASSWORD: legalflow_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legalflow-network

  redis:
    image: redis:7-alpine
    container_name: legalflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legalflow-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legalflow-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - legalflow-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  legalflow-network:
    driver: bridge

