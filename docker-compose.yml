version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legalflow_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - DATABASE_USER=${DATABASE_USER:-legalflow}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-legalflow_password}
      - DATABASE_NAME=${DATABASE_NAME:-legalflow_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - YANDEX_GPT_API_KEY=${YANDEX_GPT_API_KEY}
      - YANDEX_FOLDER_ID=${YANDEX_FOLDER_ID}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY}
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
      - chroma_data:/app/chroma_data
    depends_on:
      - mysql
      - redis
    networks:
      - legalflow_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: legalflow_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - legalflow_network
    command: npm run dev -- --host 0.0.0.0

  mysql:
    image: mysql:8.0
    container_name: legalflow_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_password}
      - MYSQL_DATABASE=${DATABASE_NAME:-legalflow_db}
      - MYSQL_USER=${DATABASE_USER:-legalflow}
      - MYSQL_PASSWORD=${DATABASE_PASSWORD:-legalflow_password}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - legalflow_network
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7-alpine
    container_name: legalflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - legalflow_network

volumes:
  mysql_data:
  redis_data:
  uploads:
  chroma_data:

networks:
  legalflow_network:
    driver: bridge
